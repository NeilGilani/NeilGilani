# Keeps the two live blocks in the profile README current:
#   DIGEST   - the latest finished note and the note in progress in quant-research
#   ACTIVITY - the most recently pushed public repos and their latest commit
# Both read real data at run time (the quant-research README and the GitHub API)
# and leave the README untouched if the fetch fails.
name: profile

on:
  schedule:
    - cron: "17 13 * * *" # daily, offset off the hour so it isn't queued
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - assets/gen_digest.py
      - assets/gen_activity.py
      - .github/workflows/profile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh research digest
        run: python assets/gen_digest.py

      - name: Refresh recent activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python assets/gen_activity.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: daily profile refresh"
          git push
